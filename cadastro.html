<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca | Cadastro</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- MENU -->

    <header>

        <nav class="navbar">

            <h1 class="logo">
                📚 Biblioteca
            </h1>

            <ul class="menu">

                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="livros.html">Livros</a>
                </li>

                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>

                <li>
                    <a href="sobre.html">Sobre</a>
                </li>

                <li>
                    <a href="contato.html">Contato</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CADASTRO -->

    <main>

        <section class="formulario">

            <h2>
                Criar Cadastro
            </h2>

            <p class="texto-formulario">
    Crie sua conta para acessar a biblioteca.
</p>

            <form id="formCadastro">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >


                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="Digite seu telefone"
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >


                <button
                    type="submit"
                    class="btn"
                >
                    Cadastrar
                </button>

            </form>

            <p>
                Já possui uma conta?

                <a href="login.html">
                    Fazer login
                </a>
            </p>

        </section>

    </main>


    <!-- RODAPÉ -->

    <footer>

        <p>
            © 2026 Biblioteca - Todos os direitos reservados.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="./js/script.js"></script>

</body>

</html>
