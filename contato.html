<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca | Contato</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- MENU -->

    <header>

        <nav class="navbar">

            <h1 class="logo">
                📚 Biblioteca
            </h1>

            <ul class="menu">

                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="livros.html">Livros</a>
                </li>

                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>

                <li>
                    <a href="sobre.html">Sobre</a>
                </li>

                <li>
                    <a href="contato.html">Contato</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CONTEÚDO -->

    <main class="container">

        <section class="formulario">

            <h2>Entre em contato</h2>

            <form id="formContato">

                <label for="nomeContato">
                    Nome
                </label>

                <input
                    type="text"
                    id="nomeContato"
                    placeholder="Digite seu nome"
                    required
                >


                <label for="emailContato">
                    E-mail
                </label>

                <input
                    type="email"
                    id="emailContato"
                    placeholder="Digite seu e-mail"
                    required
                >


                <label for="assunto">
                    Assunto
                </label>

                <input
                    type="text"
                    id="assunto"
                    placeholder="Digite o assunto"
                    required
                >


                <label for="mensagem">
                    Mensagem
                </label>

                <textarea
                    id="mensagem"
                    rows="6"
                    placeholder="Digite sua mensagem"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="btn"
                >
                    Enviar mensagem
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Biblioteca - Todos os direitos reservados.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
